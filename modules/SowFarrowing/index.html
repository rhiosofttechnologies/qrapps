<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sow Farrowing Pro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="qr-reader-container">
    <i class="fas fa-times" onclick="stopScanner()" style="position:absolute; top:20px; right:20px; color:white; font-size:30px; z-index:3001; cursor:pointer;"></i>
    <div id="qr-reader"></div>
    <p style="color:white; margin-top:15px; font-family:sans-serif;">Scan QR Code</p>
</div>

<div class="app-header">
    <div style="display:flex; align-items:center; gap:10px;">
        <i class="fas fa-arrow-left" onclick="window.history.back()" style="cursor:pointer"></i>
          <h2 id="appTitle">Sow Farrowing Records</h2>
    </div>
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search name or Scan QR..." oninput="render()">
        </div>
        <button class="qr-scan-btn" onclick="startScanner('search')"><i class="fas fa-qrcode"></i></button>
    </div>
</div>

<div class="container" id="sowList"></div>

<button class="fab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>

<div class="overlay" id="overlay" onclick="closeModal()"></div>

<div class="modal" id="recordModal">
    <h3 style="margin-top:0">Sow Record</h3>
    <div class="input-group">
        <label>QR ID / TAG DEFINITION</label>
        <div style="display:flex; gap:8px;">
            <input id="qrId" placeholder="Scan or type QR ID">
            <button onclick="startScanner('input')" style="padding:0 15px; border-radius:10px; border:1px solid var(--border); color:var(--primary); background:var(--bg); cursor:pointer"><i class="fas fa-qrcode"></i></button>
        </div>
    </div>
    <div class="input-group"><label>SOW NAME</label><input id="sowName" placeholder="e.g. Sow-A1"></div>
    <div class="input-group"><label>DATE FARROWED</label><input id="bornDate" type="date"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div class="input-group"><label>PARITY</label><input id="parity" type="number"></div>
        <div class="input-group"><label>BORN ALIVE</label><input id="alive" type="number"></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div class="input-group"><label>STILLBIRTH</label><input id="still" type="number"></div>
        <div class="input-group"><label>MUMMIFIED</label><input id="mummified" type="number" placeholder="0"></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div class="input-group"><label>WEAN</label><input id="wean" type="number"></div>
        <div class="input-group"><label>DEATHS</label><input id="deaths" type="number"></div>
    </div>
    <button class="primary-btn" onclick="saveRecord()">Save Sow Data</button>
</div>

<div class="modal" id="noteModal">
    <h3 id="noteModalTitle" style="margin-top:0">Add Note</h3>
    <div class="input-group"><label>DATE</label><input id="noteDate" type="date"></div>
    <div class="input-group"><label>DETAILS</label><textarea id="noteText" rows="3"></textarea></div>
    <button class="primary-btn" onclick="saveNote()">Save Note</button>
</div>

<script src="js/script.js"></script>
</body>
</html>
