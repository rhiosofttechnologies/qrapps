<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   FLIPBOOK
========================================================= */

#book{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    overflow:hidden;
}


/* =========================================================
   EVERY PAGE
========================================================= */

.page{
    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#fff;

    overflow:hidden;

    user-select:none;
    -webkit-user-select:none;
}


/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:
        clamp(20px,5vw,80px);

    text-align:center;
}


/* =========================================================
   COVER
========================================================= */

.cover{
    position:relative;

    background:#000;

    padding:0;

    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    pointer-events:none;
}

.cover::before{
    content:"";

    position:absolute;
    inset:0;

    background:#000;

    z-index:-1;
}


/* =========================================================
   GALLERY PAGE
========================================================= */

.gallery-page{
    position:relative;

    z-index:20;

    background:#f5f5f5;

    overflow:hidden !important;
}


/* =========================================================
   GALLERY CONTENT
========================================================= */

.gallery-content{

    position:relative;

    z-index:30;

    width:100%;
    height:100%;

    display:block;

    padding:
        clamp(20px,4vw,60px);

    overflow-y:auto !important;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    touch-action:pan-y;

    overscroll-behavior:contain;

    scrollbar-width:none;
}


.gallery-content::-webkit-scrollbar{
    display:none;
}


/* =========================================================
   GALLERY TITLE
========================================================= */

.gallery-title{

    font-size:
        clamp(2rem,5vw,4rem);

    margin-bottom:5px;

    color:#222;

    text-align:center;
}


.gallery-subtitle{

    font-size:
        clamp(.9rem,2vw,1.2rem);

    color:#777;

    margin-bottom:30px;

    text-align:center;
}


/* =========================================================
   GALLERY GRID
========================================================= */

.gallery-grid{

    width:100%;

    max-width:1400px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:22px;

    margin:0 auto;

    padding:5px;

    padding-bottom:100px;

    min-height:max-content;

    pointer-events:auto;
}


/* =========================================================
   GALLERY CARD
========================================================= */

.gallery-card{

    position:relative;

    z-index:50;

    width:100%;

    height:
        clamp(
            220px,
            38vh,
            420px
        );

    border-radius:16px;

    overflow:hidden;

    background:#ddd;

    cursor:pointer;

    pointer-events:auto;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.18);

    transform:translateZ(0);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}


.gallery-card:hover{

    transform:
        translateY(-7px);

    box-shadow:
        0 16px 35px
        rgba(0,0,0,.28);
}


/* =========================================================
   CARD IMAGE
========================================================= */

.gallery-card img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    pointer-events:none;

    user-select:none;

    -webkit-user-drag:none;

    transition:
        transform .5s ease;
}


.gallery-card:hover img{

    transform:
        scale(1.07);
}


/* =========================================================
   CARD OVERLAY
========================================================= */

.card-overlay{

    position:absolute;

    inset:0;

    z-index:2;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    align-items:center;

    padding-bottom:25px;

    color:#fff;

    text-align:center;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.75),
            rgba(0,0,0,0)
            65%
        );

    pointer-events:none;
}


/* =========================================================
   TAP ICON
========================================================= */

.tap-icon{

    width:48px;
    height:48px;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:8px;

    border-radius:50%;

    background:
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(6px);

    font-size:23px;

    animation:
        tapPulse 1.5s infinite;
}


@keyframes tapPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
    }
}


/* =========================================================
   TAP TEXT
========================================================= */

.tap-text{

    font-size:15px;

    font-weight:bold;

    letter-spacing:.4px;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.8);
}


/* =========================================================
   IMAGE MODAL
========================================================= */

.image-modal{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:none;

    justify-content:center;
    align-items:center;

    padding:30px;

    background:
        rgba(0,0,0,.96);

    z-index:999999;

    pointer-events:auto;
}


.image-modal.active{
    display:flex;
}


/* =========================================================
   MODAL IMAGE
========================================================= */

.modal-image{

    max-width:90vw;

    max-height:86vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.8);

    animation:
        modalZoom .3s ease;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:auto;
}


@keyframes modalZoom{

    from{
        opacity:0;

        transform:
            scale(.8);
    }

    to{
        opacity:1;

        transform:
            scale(1);
    }
}


/* =========================================================
   MODAL CLOSE
========================================================= */

.modal-close{

    position:absolute;

    top:20px;
    right:25px;

    width:52px;
    height:52px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.15);

    color:#fff;

    font-size:34px;

    line-height:1;

    cursor:pointer;

    z-index:10;

    pointer-events:auto;

    transition:
        background .2s ease,
        transform .2s ease;
}


.modal-close:hover{

    background:
        rgba(255,255,255,.3);

    transform:
        rotate(90deg);
}


/* =========================================================
   MODAL PREVIOUS / NEXT
========================================================= */

.modal-prev,
.modal-next{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    width:58px;
    height:58px;

    border:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.15);

    color:#fff;

    font-size:40px;

    line-height:1;

    cursor:pointer;

    z-index:10;

    pointer-events:auto;

    transition:
        background .2s ease;
}


.modal-prev{
    left:25px;
}


.modal-next{
    right:25px;
}


.modal-prev:hover,
.modal-next:hover{

    background:
        rgba(255,255,255,.3);
}


/* =========================================================
   MODAL CAPTION
========================================================= */

.modal-caption{

    position:absolute;

    bottom:20px;
    left:50%;

    transform:
        translateX(-50%);

    max-width:80vw;

    padding:
        8px 18px;

    border-radius:20px;

    color:#fff;

    background:
        rgba(0,0,0,.55);

    font-size:14px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    pointer-events:none;
}


/* =========================================================
   MUSIC BUTTON
========================================================= */

.music-control{

    position:fixed;

    right:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border:none;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    color:#fff;

    font-size:22px;

    cursor:pointer;

    z-index:1000000;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    transition:
        transform .25s ease,
        background .25s ease;
}


.music-control:hover{

    transform:
        scale(1.1);

    background:
        rgba(255,255,255,.25);
}


/* Music playing animation */

.music-control.playing{

    animation:
        musicPulse 1.5s infinite;
}


@keyframes musicPulse{

    0%{
        box-shadow:
            0 0 0 0
            rgba(255,255,255,.25);
    }

    70%{
        box-shadow:
            0 0 0 12px
            rgba(255,255,255,0);
    }

    100%{
        box-shadow:
            0 0 0 0
            rgba(255,255,255,0);
    }
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .gallery-grid{

        gap:18px;
    }

}


/* =========================================================
   PREVENT IMAGE DRAG
========================================================= */

img{

    -webkit-user-drag:none;

    user-drag:none;
}

</style>

</head>

<!-- =======================================================

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>


<script>

/* =========================================================
   BACKGROUND MUSIC
========================================================= */

const backgroundMusic =
    document.getElementById(
        "backgroundMusic"
    );


const musicControl =
    document.getElementById(
        "musicControl"
    );


let musicPlaying = false;


/* =========================================================
   START MUSIC
========================================================= */

function startMusic(){

    backgroundMusic.volume = 0.35;

    backgroundMusic.play()
        .then(() => {

            musicPlaying = true;

            musicControl.textContent = "🔊";

            musicControl.classList.add(
                "playing"
            );

        })
        .catch(() => {

            /*
                Browser blocked autoplay.
                Music will start after the
                next user interaction.
            */

        });

}


/* =========================================================
   STOP MUSIC
========================================================= */

function stopMusic(){

    backgroundMusic.pause();

    musicPlaying = false;

    musicControl.textContent = "🔇";

    musicControl.classList.remove(
        "playing"
    );

}


/* =========================================================
   MUSIC BUTTON
========================================================= */

musicControl.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();


        if(musicPlaying){

            stopMusic();

        }
        else{

            startMusic();

        }

    }

);


/* =========================================================
   START MUSIC AFTER FIRST USER INTERACTION
========================================================= */

function firstInteraction(){

    if(!musicPlaying){

        startMusic();

    }


    document.removeEventListener(
        "pointerdown",
        firstInteraction,
        true
    );

}


document.addEventListener(

    "pointerdown",

    firstInteraction,

    true

);


/* =========================================================
   INITIALIZE FLIPBOOK
========================================================= */

const bookElement =
    document.getElementById(
        "book"
    );


const pages =
    document.querySelectorAll(
        ".page"
    );


const pageFlip =
    new St.PageFlip(

        bookElement,

        {

            width:600,

            height:900,

            size:"stretch",

            minWidth:280,

            maxWidth:2000,

            minHeight:400,

            maxHeight:3000,

            showCover:true,

            drawShadow:true,

            flippingTime:900,

            usePortrait:true,

            mobileScrollSupport:false,

            useMouseEvents:true,

            swipeDistance:30,

            startPage:0,

            startZIndex:10,

            autoSize:true

        }

    );


/* =========================================================
   LOAD PAGES
========================================================= */

pageFlip.loadFromHTML(pages);


/* =========================================================
   AUTO FLIP
========================================================= */

let autoFlip = true;

const AUTO_TIME = 8000;


setInterval(

    () => {

        if(!autoFlip){

            return;

        }


        const current =
            pageFlip.getCurrentPageIndex();


        const total =
            pageFlip.getPageCount();


        if(
            current <
            total - 1
        ){

            pageFlip.flipNext();

        }
        else{

            pageFlip.turnToPage(0);

        }

    },

    AUTO_TIME

);


/* =========================================================
   GALLERY
========================================================= */

const galleryCards =
    document.querySelectorAll(
        ".gallery-card"
    );


const galleryImages =
    Array.from(galleryCards)
        .map(card => {

            return {

                image:
                    card.dataset.image,

                title:
                    card.dataset.title

            };

        });


/* =========================================================
   MODAL
========================================================= */

const imageModal =
    document.getElementById(
        "imageModal"
    );


const modalImage =
    document.getElementById(
        "modalImage"
    );


const modalCaption =
    document.getElementById(
        "modalCaption"
    );


const modalClose =
    document.getElementById(
        "modalClose"
    );


const modalPrev =
    document.getElementById(
        "modalPrev"
    );


const modalNext =
    document.getElementById(
        "modalNext"
    );


let currentImage = 0;


/* =========================================================
   SHOW IMAGE
========================================================= */

function showImage(index){

    if(!galleryImages.length){

        return;

    }


    const item =
        galleryImages[index];


    modalImage.src =
        item.image;


    modalImage.alt =
        item.title;


    modalCaption.textContent =
        item.title;

}


/* =========================================================
   OPEN MODAL
========================================================= */

function openModal(index){

    currentImage = index;

    showImage(
        currentImage
    );

    imageModal.classList.add(
        "active"
    );

    autoFlip = false;

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    imageModal.classList.remove(
        "active"
    );

    modalImage.src = "";


    clearTimeout(
        window.resumeAutoFlip
    );


    window.resumeAutoFlip =
        setTimeout(

            () => {

                autoFlip = true;

            },

            5000

        );

}


/* =========================================================
   NEXT IMAGE
========================================================= */

function nextImage(){

    if(!galleryImages.length){

        return;

    }


    currentImage++;


    if(
        currentImage >=
        galleryImages.length
    ){

        currentImage = 0;

    }


    showImage(
        currentImage
    );

}


/* =========================================================
   PREVIOUS IMAGE
========================================================= */

function previousImage(){

    if(!galleryImages.length){

        return;

    }


    currentImage--;


    if(currentImage < 0){

        currentImage =
            galleryImages.length - 1;

    }


    showImage(
        currentImage
    );

}


/* =========================================================
   GALLERY CARD CLICK
========================================================= */

galleryCards.forEach(

    (card,index) => {


        card.addEventListener(

            "pointerdown",

            function(event){

                event.stopPropagation();

                autoFlip = false;

            },

            true

        );


        card.addEventListener(

            "pointerup",

            function(event){

                event.stopPropagation();

            },

            true

        );


        card.addEventListener(

            "click",

            function(event){

                event.preventDefault();

                event.stopPropagation();

                openModal(index);

            },

            true

        );


        card.addEventListener(

            "touchend",

            function(event){

                event.preventDefault();

                event.stopPropagation();

                openModal(index);

            },

            {

                passive:false,

                capture:true

            }

        );

    }

);


/* =========================================================
   GALLERY SCROLL PROTECTION
========================================================= */

const galleryContent =
    document.querySelector(
        ".gallery-content"
    );


if(galleryContent){


    galleryContent.addEventListener(

        "pointerdown",

        function(event){

            event.stopPropagation();

        },

        true

    );


    galleryContent.addEventListener(

        "pointermove",

        function(event){

            event.stopPropagation();

        },

        true

    );


    galleryContent.addEventListener(

        "touchstart",

        function(event){

            event.stopPropagation();

        },

        {

            passive:true,

            capture:true

        }

    );


    galleryContent.addEventListener(

        "touchmove",

        function(event){

            event.stopPropagation();

        },

        {

            passive:true,

            capture:true

        }

    );

}


/* =========================================================
   MODAL CLOSE
========================================================= */

modalClose.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();

        closeModal();

    },

    true

);


/* =========================================================
   MODAL NEXT
========================================================= */

modalNext.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();

        nextImage();

    },

    true

);


/* =========================================================
   MODAL PREVIOUS
========================================================= */

modalPrev.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();

        previousImage();

    },

    true

);


/* =========================================================
   MODAL BACKGROUND CLOSE
========================================================= */

imageModal.addEventListener(

    "click",

    function(event){

        if(
            event.target ===
            imageModal
        ){

            closeModal();

        }

    }

);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function(event){

        if(
            !imageModal.classList
                .contains("active")
        ){

            return;

        }


        if(
            event.key === "Escape"
        ){

            closeModal();

        }


        if(
            event.key === "ArrowRight"
        ){

            nextImage();

        }


        if(
            event.key === "ArrowLeft"
        ){

            previousImage();

        }

    }

);


/* =========================================================
   MODAL SWIPE
========================================================= */

let modalTouchStartX = 0;


imageModal.addEventListener(

    "touchstart",

    function(event){

        modalTouchStartX =
            event.changedTouches[0]
                .screenX;

    },

    {
        passive:true
    }

);


imageModal.addEventListener(

    "touchend",

    function(event){

        const modalTouchEndX =
            event.changedTouches[0]
                .screenX;


        const distance =
            modalTouchEndX -
            modalTouchStartX;


        if(
            distance < -50
        ){

            nextImage();

        }


        if(
            distance > 50
        ){

            previousImage();

        }

    },

    {
        passive:true
    }

);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    function(){

        pageFlip.update();

    }

);


/* =========================================================
   PAUSE AUTO FLIP WHILE MOUSE
   IS OVER GALLERY
========================================================= */

if(galleryContent){

    galleryContent.addEventListener(

        "mouseenter",

        function(){

            autoFlip = false;

        }

    );


    galleryContent.addEventListener(

        "mouseleave",

        function(){

            autoFlip = true;

        }

    );

}

</script>


</body>
</html>
