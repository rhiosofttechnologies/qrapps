<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Digital Invitation - RhioSoft Technologies</title>

<!-- Font Awesome for Music Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   FLIPBOOK
========================================================= */

#book{
    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    overflow:hidden;
    margin:0;
    padding:0;
}




/* =========================================================
   EVERY PAGE & BORDER CONTAINER
========================================================= */

.page{
    position: relative;
    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#111;

    overflow:hidden;

    user-select:none;
    -webkit-user-select:none;

    padding:0;
}

.page-container{
    position:relative;

    width:100%;
    height:100%;

    background:#000;

    border:none;
    border-radius:0;

    box-shadow:none;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

.page-container img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    pointer-events:none;

    image-rendering:-webkit-optimize-contrast;
}

/* Page Corner Fold Visual Hint */
.page-container::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 35px 35px;
    border-color: transparent transparent rgba(255, 255, 255, 0.3) transparent;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.3s ease;
}

/* Page Logo at the bottom center */
.page-logo {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    
    height: 24px;
    width: auto;
    object-fit: contain !important;
    
    z-index: 5;
    pointer-events: none;
    opacity: 0.85;
}

/* Page Number Badge */
.page-number{
    position:absolute;

    bottom:12px;
    right:16px;

    font-size:12px;
    font-weight:bold;

    color:#444;

    background:rgba(255,255,255,.85);

    padding:3px 8px;

    border-radius:12px;
    border:1px solid rgba(0,0,0,.1);

    z-index:5;

    pointer-events:none;

    margin-bottom:10vh;
    margin-top:-5vh;
}


/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:
        clamp(20px,5vw,80px);

    text-align:center;
}


/* =========================================================
   COVER
========================================================= */

.page.--cover{
    background:#000;
}

.page.--cover .page-container img{
    object-fit:contain;
}





/* =========================================================
   MUSIC BUTTON
========================================================= */

.music-control{

    position:fixed;

    right:20px;
    bottom:20px;

    width:52px;
    height:52px;

    border:none;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    color:#fff;

    font-size:22px;

    cursor:pointer;

    z-index:1000000;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    transition:
        transform .25s ease,
        background .25s ease;
}


.music-control:hover{

    transform:
        scale(1.1);

    background:
        rgba(255,255,255,.25);
}


/* Music playing animation */

.music-control.playing{

    animation:
        musicPulse 1.5s infinite;
}


@keyframes musicPulse{

    0%{
        box-shadow:
            0 0 0 0
            rgba(255,255,255,.25);
    }

    70%{
        box-shadow:
            0 0 0 12px
            rgba(255,255,255,0);
    }

    100%{
        box-shadow:
            0 0 0 0
            rgba(255,255,255,0);
    }
}


/* =========================================================
   BOTTOM NOTICE BAR
========================================================= */

.bottom-info-note {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 8px 18px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;

    color: #fff;
    font-size: 13px;
    letter-spacing: 0.3px;

    z-index: 99999;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}

.bottom-info-note i {
    color: #ffca28;
    font-size: 14px;
}

.bottom-info-note span {
    opacity: 0.9;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .gallery-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:18px;
    }


    .gallery-card{

        height:
            clamp(
                220px,
                32vh,
                380px
            );
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .music-control{

        width:44px;
        height:44px;

        right:12px;
        bottom:12px;

        font-size:19px;
    }

    .bottom-info-note {
        font-size: 11px;
        padding: 6px 14px;
        bottom: 10px;
        left: 12px;
        transform: none;
        max-width: calc(100% - 70px);
    }

    .page-logo {
        height: 18px;
        bottom: 8px;
    }

}


/* =========================================================
   PREVENT IMAGE DRAG
========================================================= */

img{

    -webkit-user-drag:none;

    user-drag:none;
}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND MUSIC
======================================================= -->

<audio
    id="backgroundMusic"
    src="./audio/music.mp3"
    loop

></audio>


<!-- =======================================================

========================================================= -->

<button

    title="Music"

<!-- =======================================================

========================================================= -->

<div class="bottom-info-note">

    <span>Tap screen for music • Swipe or tap corners to turn pages</span>

<!-- =======================================================

======================================================= -->

<div id="book">


    <!-- FRONT COVER -->

     <!-- BACK COVER -->

    <!-- PAGE 4 -->

    <!-- PAGE 5 -->
    <div class="page  --cover" data-density="soft">

<!-- =======================================================
     PAGE FLIP LIBRARY
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>


<script>

/* =========================================================
   BACKGROUND MUSIC
========================================================= */

const backgroundMusic =
    document.getElementById(
        "backgroundMusic"
    );


const musicControl =
    document.getElementById(
        "musicControl"
    );


let musicPlaying = false;


/* =========================================================
   START MUSIC
========================================================= */

function startMusic(){

    backgroundMusic.volume = 0.35;

    backgroundMusic.play()
        .then(() => {

            musicPlaying = true;

            musicControl.innerHTML = '<i class="fa-solid fa-volume-high"></i>';

            musicControl.classList.add(
                "playing"
            );

        })
        .catch(() => {

            /*
                Browser blocked autoplay.
                Music will start after the
                next user interaction.
            */

        });

}


/* =========================================================
   STOP MUSIC
========================================================= */

function stopMusic(){

    backgroundMusic.pause();

    musicPlaying = false;

    musicControl.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';

    musicControl.classList.remove(
        "playing"
    );

}


/* =========================================================
   TOGGLE MUSIC (PLAY / MUTE)
========================================================= */

function toggleMusic(){

    if(musicPlaying){

        stopMusic();

    }
    else{

        startMusic();

    }

}


/* =========================================================
   MUSIC BUTTON
========================================================= */

musicControl.addEventListener(

    "click",

    function(event){

        event.preventDefault();

        event.stopPropagation();


        toggleMusic();

    }

);


/* =========================================================
   SCREEN TAP TO PLAY / MUTE MUSIC
========================================================= */

document.addEventListener(

    "click",

    function(event){

        /* Don't trigger if user clicked directly on the music button */
        if(musicControl.contains(event.target)){

            return;

        }


        toggleMusic();

    }

);


/* =========================================================
   INITIALIZE FLIPBOOK
========================================================= */

const bookElement =
    document.getElementById(
        "book"
    );


const pages =
    document.querySelectorAll(
        ".page"
    );


const pageFlip =
    new St.PageFlip(

        bookElement,

        {

            width: window.innerWidth,

            height: window.innerHeight,

            size:"stretch",

            minWidth:280,

            maxWidth:2500,

            minHeight:400,

            maxHeight:3500,

            showCover:true,

            drawShadow:true,

            showPageCorners:true,

            flippingTime:600,

            usePortrait:true,

            mobileScrollSupport:false,

            useMouseEvents:true,

            swipeDistance:30,

            startPage:0,

            startZIndex:10,

            autoSize:true

        }

    );


/* =========================================================
   LOAD PAGES
========================================================= */

pageFlip.loadFromHTML(pages);


/* =========================================================
   AUTO FLIP & MUSIC AUTO-PLAY ON FIRST FLIP
========================================================= */

let autoFlip = true;
let isFlipping = false;

const AUTO_TIME = 5000;

pageFlip.on('flip', (e) => {
    isFlipping = true;

    // Start background music on the very first page flip if not playing
    if (!musicPlaying) {
        startMusic();
    }
});

pageFlip.on('changeState', (e) => {
    if (e.data === 'read') {
        isFlipping = false;
    }
});


setInterval(

    () => {

        if(!autoFlip || isFlipping){

            return;

        }


        const current =
            pageFlip.getCurrentPageIndex();


        const total =
            pageFlip.getPageCount();


        if(
            current <
            total - 1
        ){

            pageFlip.flipNext();

        }
        else{

            pageFlip.turnToPage(0);

        }

    },

    AUTO_TIME

);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    function(){

        pageFlip.update();

    }

);

</script>


</body>
